name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.4.3
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate version tag
        id: version
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Use an existing version tag in vMAJOR.MINOR.PATCH form, such as v1.2.0.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check out version tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out tag and release notes
        run: |
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The version tag does not exist.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) { throw 'HEAD does not match the version tag.' }
          $notes = "docs/RELEASE-$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes are missing: $notes" }

      - name: Build, test and render previews
        run: .\build.ps1 -Test -Preview -OutputDirectory 'dist\CarbonControl'

      - name: Package portable application
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_VERSION -ApplicationDirectory 'dist\CarbonControl' -OutputDirectory 'release'

      - name: Retain test results and previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ env.RELEASE_TAG }}
          path: |
            test-results.txt
            ui-test-results.txt
            previews/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $title = "Carbon Control $tag"
          $notes = "docs/RELEASE-$tag.md"
          $assets = @("release/CarbonControl-v$env:RELEASE_VERSION-win-x64.zip", 'release/SHA256SUMS.txt')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset is missing: $asset" }
          }
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing release versions.' }
          foreach ($page in (($published -join "`n") | ConvertFrom-Json)) {
            foreach ($release in $page) {
              if (-not $release.draft -and -not $release.prerelease -and $release.tag_name -match '^v\d+\.\d+\.\d+$') {
                if ([version]$release.tag_name.Substring(1) -gt [version]$env:RELEASE_VERSION) {
                  throw 'A newer stable release already exists. The older version will not be republished.'
                }
              }
            }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notes --draft=false --prerelease=false --latest --verify-tag
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notes --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release verification failed.' }

      - name: Remove older releases after verifying the new download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\prune-releases.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
